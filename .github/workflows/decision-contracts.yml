name: decision-contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: decision-contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-decision-dev.txt
      - run: python -B -m unittest discover -s tests/decisions -v
      - run: python -B tests/decisions/check_architecture.py
      - run: python -m compileall -q engine tests/decisions
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - run: python -m pip_audit --strict --requirement requirements-decision-dev.txt
