# Secret scan — the one check this repository actually needs.
#
# The adoption decision requires a "scoped secret scan" before every
# substantive merge and "relevant exact-head checks" on the PR. Until now this
# repository had no workflows at all, so that requirement rested entirely on
# whoever remembered to run a scan by hand — on a repository that is public,
# where a leaked byte is world-readable the moment it is pushed.
#
# Deliberately only this check. The ecosystem's reusable-security-audit gate
# offers a `framework` profile, but it requires shellcheck and audits shell
# sources; this repository has zero shell scripts and zero stack manifests, so
# that profile would install a linter to examine nothing and report success.
# A check that cannot fail is worse than no check: it reads as coverage.
# When executable code lands here, add the profile that matches it.
#
# The job mirrors the ecosystem's own gitleaks step (datarim security.yml):
# same pinned version, same SHA256 verification, same full-history scan.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: a secret removed from the working tree is still
          # readable in the commit that introduced it.
          fetch-depth: 0

      - name: Install gitleaks (pinned binary)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          actual="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [ "$actual" != "$GITLEAKS_SHA256" ]; then
            echo "::error::gitleaks tarball SHA256 mismatch (expected $GITLEAKS_SHA256, got $actual)"
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree + full history
        run: |
          set -euo pipefail
          gitleaks detect --redact --no-banner --exit-code 1 \
            --log-opts="--all" \
            --report-format sarif --report-path /tmp/gitleaks.sarif

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: /tmp/gitleaks.sarif
          if-no-files-found: ignore
